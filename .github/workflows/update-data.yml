# Actualiza los datos macro todos los días y los sube al repositorio.
# GitHub Pages publica el sitio desde la rama main, así que la página
# muestra los datos nuevos apenas termina este workflow.
name: Actualizar datos

on:
  schedule:
    - cron: '30 11 * * *'   # todos los días 11:30 UTC (8:30 en Argentina)
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar series (PowerShell 7 viene instalado en el runner)
        shell: pwsh
        env:
          # Clave gratuita de BLS (opcional): sube el límite de consultas diarias. Ver README.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: ./tools/fetch-data.ps1

      # Lee los calendarios oficiales del INDEC y de la Fed; si no responden, conserva el anterior
      - name: Actualizar calendario de próximos datos
        shell: pwsh
        continue-on-error: true
        run: ./tools/update-calendar.ps1

      - name: Validar que no haya series vacías
        shell: pwsh
        run: |
          foreach ($f in 'argentina','usa','dolar') {
            $j = Get-Content "data/$f.json" -Raw | ConvertFrom-Json
            foreach ($i in $j.indicators) {
              if (-not $i.points -or $i.points.Count -eq 0) { throw "Serie vacía: $f/$($i.id)" }
            }
          }
          $c = Get-Content "data/calendario.json" -Raw | ConvertFrom-Json
          if (-not $c.eventos -or $c.eventos.Count -eq 0) { throw "Calendario sin eventos" }

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Actualizar datos $(date -u +%F)"
          git push
