# Cotizaciones globales de la barra del Inicio (S&P 500, Nasdaq, VIX, bono a 10 años, DXY, oro, petróleo, etc.).
# Corre cada 30 minutos en días hábiles durante el horario de los mercados, y cada 4 horas el resto del tiempo.
# GitHub puede demorar las corridas programadas unos minutos.
name: Actualizar mercados

on:
  schedule:
    - cron: '*/30 12-22 * * 1-5'   # 9:00 a 19:30 ARG, lunes a viernes
    - cron: '17 */4 * * *'          # resto del tiempo (cripto, futuros, cierres)
  workflow_dispatch:

permissions:
  contents: write

# Un solo proceso a la vez escribe en main (comparte grupo con "Actualizar datos")
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Descargar cotizaciones
        shell: pwsh
        run: ./tools/fetch-mercados.ps1

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercados.json
          git diff --staged --quiet || git commit -m "Actualizar mercados $(date -u +%FT%H:%MZ)"
          git pull --rebase
          git push
